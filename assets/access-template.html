<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待核论文 · 全文获取清单</title><style>
:root{--ink:#382f25;--muted:#756653;--accent:#96510e;--line:#decdb5;--paper:#faf7f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:38px 28px}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}header{border-top:6px solid var(--accent);padding-top:18px}small,.meta{color:var(--muted);font-size:12px}h1{font-size:30px;line-height:1.4;margin:10px 0}p{margin:8px 0}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 12px}button,input,select{font:inherit;padding:9px 12px;border:1px solid var(--line);background:white;border-radius:3px;color:var(--ink)}button{cursor:pointer}input{flex:1;min-width:200px}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.row{display:grid;grid-template-columns:90px minmax(0,1fr) 168px;gap:16px;background:white;border:1px solid var(--line);padding:16px;margin:8px 0;align-items:start}.id{font:12px/1.7 Consolas,monospace;color:var(--muted)}h2{font-size:15px;margin:0 0 5px;overflow-wrap:anywhere}.journal{font-size:12px;font-weight:600}.actions{display:grid;gap:7px;font-size:12px}.actions a{padding:5px 9px;background:#f7eee1;border:1px solid #e5d5bf}.badge{display:inline-block;background:#eef4ef;color:#2f6545;padding:2px 5px;font-size:10px;margin-top:5px}.missing{background:#fbeddc;color:#8b4d13}.note{font-size:11px;color:var(--muted);margin-top:5px}#status{min-height:24px;font-size:12px;color:var(--muted)}footer{margin-top:28px;border-top:1px solid var(--line);padding-top:16px;font-size:12px}nav{display:flex;gap:16px;flex-wrap:wrap}@media(max-width:650px){main{padding:22px 16px}.row{grid-template-columns:minmax(0,1fr);gap:7px}.actions{display:flex;flex-wrap:wrap}h1{font-size:25px}}
</style></head><body><main><header><nav><a href="index.html#next">← 返回 05 待核文献</a><a href="data/pending-access.csv" download>下载清单 CSV</a><a href="data/pending-bookmarks.html" download>下载 Chrome 书签文件</a></nav><small>05 / FULL-TEXT ACCESS</small><h1>待核论文 · 全文获取清单</h1><p id="summary"></p><p class="meta">材料状态仅指当前核验资料和 Zotero 附件，不代表出版社或全网没有可获取全文。已有 PDF 与数据来源是否确认分别记录。学校入口沿用华南理工 WebVPN，首次访问可能需要学校登录。</p></header><div class="tools"><input id="q" aria-label="搜索论文" placeholder="搜索题名、期刊、编号或 DOI"><select id="material" aria-label="材料状态"><option value="all">全部论文</option><option value="missing">仍需下载 PDF</option><option value="saved">已有本地 PDF</option></select><select id="route" aria-label="访问方式"><option value="official">出版商 / 原始页面</option><option value="vpn">优先学校 WebVPN</option></select><button class="primary" id="batch">打开下一批（最多 6 篇）</button><button id="reset">重置打开记录</button></div><p id="status" role="status" aria-live="polite"></p><div id="list"></div><footer>分批打开可以减少浏览器负担。如 Chrome 阻止多个弹出页，可直接点击每篇论文入口；也可把书签文件导入 Chrome，保留完整清单。页面仅保存本机的打开记录，不上传阅读进度。</footer></main><script id="access-data" type="application/json">__ACCESS_DATA__</script><script>
'use strict';
const rows=JSON.parse(document.querySelector('#access-data').textContent),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let opened=new Set();try{opened=new Set(JSON.parse(localStorage.getItem('sdk-access-opened')||'[]'))}catch{}
const filtered=()=>rows.filter(r=>($('#material').value==='all'||r.pdf_downloaded===($('#material').value==='saved'))&&[r.title,r.journal,r.id,r.doi].join(' ').toLowerCase().includes($('#q').value.trim().toLowerCase()));
const save=()=>{try{localStorage.setItem('sdk-access-opened',JSON.stringify([...opened]))}catch{}};
function render(){const shown=filtered();$('#summary').textContent=`${rows.length} 篇待核论文 · ${rows.filter(r=>r.review_state==='reviewed_unnamed').length} 篇正文已核但未具名 · ${rows.filter(r=>r.review_state==='pdf_unreviewed').length} 篇已有正文待审 · ${rows.filter(r=>!r.pdf_downloaded).length} 篇缺正文`;$('#status').textContent=`显示 ${shown.length} 篇；本机已打开 ${shown.filter(r=>opened.has(r.id)).length} 篇。`;$('#list').innerHTML=shown.map(r=>`<article class="row"><div class="id">${esc(r.id)}<br><span class="badge ${r.pdf_downloaded?'':'missing'}">${esc(r.review_label)}</span></div><div><h2>${esc(r.title)}</h2><div class="journal">${esc(r.journal||'出版物待核')} · ${esc(r.year)}</div><div class="meta">${esc(r.doi)}</div>${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}</div><div class="actions"><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" data-id="${esc(r.id)}">${r.search_only?'题名检索 ↗':'论文原始页面 ↗'}</a>${r.vpn_url?`<a href="${esc(r.vpn_url)}" target="_blank" rel="noopener noreferrer" data-id="${esc(r.id)}">学校 WebVPN ↗</a>`:''}<a href="index.html#paper-${esc(r.id)}">知识库记录 ↗</a></div></article>`).join('')||'<p>没有匹配论文。</p>';}
$('#q').addEventListener('input',render);$('#material').addEventListener('change',render);$('#list').addEventListener('click',e=>{const a=e.target.closest('a[data-id]');if(a){opened.add(a.dataset.id);save()}});
$('#batch').addEventListener('click',()=>{const batch=filtered().filter(r=>!opened.has(r.id)).slice(0,6);let n=0;for(const r of batch){const u=$('#route').value==='vpn'&&r.vpn_url?r.vpn_url:r.url;const w=window.open(u,'_blank');if(!w)break;try{w.opener=null}catch{}opened.add(r.id);n++}save();render();$('#status').textContent=batch.length?`本批打开 ${n} 篇。${n<batch.length?'Chrome 阻止了后续弹出页；可直接点击逐篇入口。':''}`:'当前筛选中的论文均已打开。';});
$('#reset').addEventListener('click',()=>{opened.clear();save();render()});render();
</script></body></html>
